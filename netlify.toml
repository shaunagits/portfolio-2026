[build]
  command = "npm run build"
  publish = "dist"

# Domains, since the 2026-08-19 swap: shauna.dev is the PRIMARY custom domain
# on this Netlify site (byshauna) and shauna.digital is a domain alias. Netlify
# 301s every alias request to the primary automatically, path included, so no
# host-keyed redirect rules are needed here — and none should be added. The
# runbook for the swap (and the record of the 2026-08-13 API outage that is
# the reason domain moves go through the Netlify UI only) is DOMAIN-SWAP.md.
#
# /links is a real page in this repo again (src/pages/links.astro), returned
# from the retired shauna-dev Netlify project in the same swap, so the 301s
# that used to bridge it are gone.

# /card is the business card's QR target and a real page (src/pages/card.astro).
# The QR code is printed, so that route must never move. /cards is a typo net.
[[redirects]]
  from = "/cards"
  to = "/card/"
  status = 301

# Save Contact on /card. text/vcard makes iOS and Android open the contact sheet
# instead of showing raw text.
[[headers]]
  for = "/shauna-arnold.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "attachment; filename=Shauna-Arnold.vcf"

# ---------------------------------------------------------------------------
# Security headers. The site is fully static, so it can afford a tight policy.
# script-src/style-src need 'unsafe-inline' because Astro inlines the small
# scroll/nav script and inlines small stylesheets by default. form-action is
# scoped to Formspree, the only place this site is allowed to POST to.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://formspree.io; form-action https://formspree.io"

# Fingerprinted build assets — safe to cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images are not fingerprinted: cache, but let them revalidate.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# TEMPORARY (2026-10-07): homepage v2 links to pages still being built.
# 302 so nothing caches them; delete each rule when its page ships.
[[redirects]]
  from = "/system"
  to = "/#system"
  status = 302
[[redirects]]
  from = "/system/"
  to = "/#system"
  status = 302
[[redirects]]
  from = "/resume/"
  to = "https://www.linkedin.com/in/shaunaarnold/"
  status = 302
[[redirects]]
  from = "/resume"
  to = "https://www.linkedin.com/in/shaunaarnold/"
  status = 302
[[redirects]]
  from = "/work/rescue-platform/"
  to = "https://shauna.digital/results/rescue-platform/"
  status = 302
[[redirects]]
  from = "/work/"
  to = "/#work"
  status = 302
[[redirects]]
  from = "/work"
  to = "/#work"
  status = 302
