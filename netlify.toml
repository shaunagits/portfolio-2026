[build]
  command = "npm run build"
  publish = "dist"

# ---------------------------------------------------------------------------
# shauna.dev is an alias on this Netlify site purely so Netlify can hold its
# TLS cert; these rules bounce every request over to shauna.digital. Without
# them the alias would SERVE the site as duplicate content instead of
# redirecting. force = true because the pages do exist in the deploy.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://shauna.dev/*"
  to = "https://shauna.digital/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.shauna.dev/*"
  to = "https://shauna.digital/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://shauna.dev/*"
  to = "https://shauna.digital/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.shauna.dev/*"
  to = "https://shauna.digital/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Security headers. The site is fully static, so it can afford a tight policy.
# script-src/style-src need 'unsafe-inline' because Astro inlines the small
# scroll/nav script and inlines small stylesheets by default. form-action is
# scoped to Formspree, the only place this site is allowed to POST to.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://formspree.io; form-action https://formspree.io"

# Fingerprinted build assets — safe to cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images are not fingerprinted: cache, but let them revalidate.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
