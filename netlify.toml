[build]
  command = "npm run build"
  publish = "dist"

# ===========================================================================
# shauna.dev — CUTOVER STEP 1 of 2: CANARY ON www ONLY.
#
# www.shauna.dev now SERVES the link-in-bio page at its own URL; the apex
# still 301s to shauna.digital (the block further down). Verify www live,
# then copy this same three-rule set for the apex to finish the cutover.
# Full runbook + rollback: CUTOVER-shauna-dev.md.
#
# Netlify takes the FIRST matching rule, so the order below is load-bearing.
# ---------------------------------------------------------------------------

# 1. Assets must stay SAME-ORIGIN.
#    /links loads two real stylesheets from /_astro/ (Astro inlined nothing),
#    and the CSP at the bottom of this file is style-src/script-src 'self'.
#    If the catch-all in rule 3 caught these and sent them to shauna.digital,
#    the browser would block both files and the page would render unstyled.
#    These sit above rule 3 precisely so that cannot happen.
[[redirects]]
  from = "https://www.shauna.dev/_astro/*"
  to = "/_astro/:splat"
  status = 200

[[redirects]]
  from = "https://www.shauna.dev/favicon.svg"
  to = "/favicon.svg"
  status = 200

[[redirects]]
  from = "https://www.shauna.dev/favicon.ico"
  to = "/favicon.ico"
  status = 200

[[redirects]]
  from = "https://www.shauna.dev/apple-touch-icon.png"
  to = "/apple-touch-icon.png"
  status = 200

# 2. The root SERVES /links (200 rewrite, NOT a redirect), so the page keeps
#    the shauna.dev URL. force = true is required for the same reason the old
#    301s needed it: / exists in the deploy as the portfolio homepage, so
#    without force Netlify serves that instead.
[[redirects]]
  from = "https://www.shauna.dev/"
  to = "/links/"
  status = 200
  force = true

# 3. Every other path still bounces to shauna.digital, so no portfolio route
#    (/blog, /work/*, …) is reachable on this host as duplicate content.
[[redirects]]
  from = "https://www.shauna.dev/*"
  to = "https://shauna.digital/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# APEX — still redirecting. This is CUTOVER STEP 2: replace this single block
# with the six above, s/www.shauna.dev/shauna.dev/, once the canary checks out.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://shauna.dev/*"
  to = "https://shauna.digital/:splat"
  status = 301
  force = true

# The two http:// blocks below are belt-and-braces. Netlify upgrades http to
# https at the edge before these path rules are consulted (verified: a request
# to http://shauna.dev/ answers 301 -> https://shauna.dev/, not straight to
# shauna.digital), so in practice the https rules above are what run. Kept
# because they cost nothing and cover a direct http hit.
[[redirects]]
  from = "http://shauna.dev/*"
  to = "https://shauna.digital/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.shauna.dev/*"
  to = "https://www.shauna.dev/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Security headers. The site is fully static, so it can afford a tight policy.
# script-src/style-src need 'unsafe-inline' because Astro inlines the small
# scroll/nav script and inlines small stylesheets by default. form-action is
# scoped to Formspree, the only place this site is allowed to POST to.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://formspree.io; form-action https://formspree.io"

# Fingerprinted build assets — safe to cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images are not fingerprinted: cache, but let them revalidate.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
