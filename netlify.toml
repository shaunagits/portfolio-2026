[build]
  command = "npm run build"
  publish = "dist"

# shauna.dev moved to its own site and repo on 2026-08-13.
#
# This file used to carry ~110 lines of host-keyed rules that served the
# link-in-bio page at shauna.dev by rewriting that host's root to /links.
# shauna.dev is now the shauna-dev Netlify project, built from
# github.com/shaunagits/shauna.dev, with its own certificate. Nothing here
# needs to know about it any more, and /links no longer exists in this repo.
#
# Do not re-add host rules for shauna.dev here. If that page ever needs to
# change, it changes in the other repo.

# The one thing left pointing that way: /links was a real 200 on this domain
# until today, so it gets a 301 rather than becoming a 404. It was never linked
# from anywhere in this site — it existed only to be rewritten onto shauna.dev —
# so this is for anything already indexed or bookmarked, not for navigation.
[[redirects]]
  from = "/links"
  to = "https://shauna.dev/"
  status = 301

[[redirects]]
  from = "/links/*"
  to = "https://shauna.dev/"
  status = 301

# ---------------------------------------------------------------------------
# Security headers. The site is fully static, so it can afford a tight policy.
# script-src/style-src need 'unsafe-inline' because Astro inlines the small
# scroll/nav script and inlines small stylesheets by default. form-action is
# scoped to Formspree, the only place this site is allowed to POST to.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://formspree.io; form-action https://formspree.io"

# Fingerprinted build assets — safe to cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images are not fingerprinted: cache, but let them revalidate.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
